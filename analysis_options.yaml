include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Ни одного из этих двух правил нет во flutter_lints 5 (там есть только
    # соседнее prefer_const_constructors_in_immutables), так что строки ничего
    # не выключают — счётчик замечаний с ними и без них одинаковый. Оставлены
    # как запись о принятом решении: включать эти правила проект не хочет.
    prefer_const_constructors: false
    prefer_single_quotes: false
